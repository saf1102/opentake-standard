name: macOS and Windows compatibility
on:
  pull_request:
    branches: [main]
  push:
    branches: [main, 'release/**']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: compatibility-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.18.0
          cache: npm
          cache-dependency-path: |
            package-lock.json
            vendor/openscreen/package-lock.json
      - run: npm ci
      - run: npm --prefix vendor/openscreen ci --ignore-scripts
      - run: npx --no-install playwright-core install chromium
      - name: Install macOS media test tools
        if: runner.os == 'macOS'
        run: brew install ffmpeg
      - name: Prepare locked Windows media test tools
        if: runner.os == 'Windows'
        run: node scripts/prepare-ci-media.mjs
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:release
      # Native Windows compilation and the official same-SHA release run in the manual workflow.
      - run: node scripts/build-desktop-ui.mjs
      - name: Prepare an explicitly non-publishable macOS candidate receipt
        if: runner.os == 'macOS'
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import {execFileSync} from 'node:child_process';
          import release from './desktop/release-contract.cjs';
          const git=args=>execFileSync('git',args,{encoding:'utf8'}).trim();
          const dirty=git(['status','--porcelain']);
          if(dirty)throw Error('Candidate source must be clean:\n'+dirty);
          const files=Object.fromEntries(git(['ls-tree','-rz','HEAD']).split('\0').filter(Boolean).map(line=>{
            const entry=/^(100644|100755) blob ([a-f0-9]+)\t([\s\S]+)$/.exec(line);
            if(!entry)throw Error('Unsupported candidate source entry');
            return [entry[3],entry[2]];
          }));
          const version=JSON.parse(fs.readFileSync('package.json','utf8')).version;
          fs.writeFileSync('release-source.json',JSON.stringify({repository:release.REPOSITORY,commit:git(['rev-parse','HEAD']),version,localCandidate:true,files}));
          NODE
      - name: Build and verify the macOS candidate DMG
        if: runner.os == 'macOS'
        run: |
          node node_modules/electron/install.js
          npm run build:installer
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: runner.os == 'macOS'
        with:
          name: macos-installer-candidate-${{ github.sha }}
          path: |
            release/*.dmg
            release/*.dmg.build.json
          if-no-files-found: error
          retention-days: 14
