name: macOS and Windows compatibility
on:
  pull_request:
    branches: [main]
  push:
    branches: [main, 'release/**']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: compatibility-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.18.0
          cache: npm
          cache-dependency-path: |
            package-lock.json
            vendor/openscreen/package-lock.json
      - run: npm ci
      - run: npm --prefix vendor/openscreen ci --ignore-scripts
      - run: npx --no-install playwright-core install chromium
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:release
      # Native Windows compilation and both installers run in the manual release workflow.
      - run: npm run build:openscreen
      - run: npx --no-install vite build
